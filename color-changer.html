<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Color Changer</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      transition: background-color 0.3s ease;
    }

    button {
      padding: 12px 24px;
      font-size: 18px;
      cursor: pointer;
      border: none;
      border-radius: 6px;
      background-color: #333;
      color: white;
    }

    button:hover {
      background-color: #555;
    }
  </style>
</head>
<body>

  <button onclick="changeBackgroundColor()">Change Background to Blue</button>

  <script>
    function changeBackgroundColor() {
      document.body.style.backgroundColor = "blue";
    }
  </script>

</body>
</html>
